name = "cf-orchestrator"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
# Your Cloudflare account ID (not a secret — safe to commit)
account_id = "4ba8ad1a8d6edbef7ae9c7b1a80d45af"

# Production routes
routes = [
  { pattern = "creatingfire.org/*", zone_name = "creatingfire.org" }
]

[vars]
ENVIRONMENT = "production"
# ── Stripe Price IDs (not secrets — safe to commit) ───────────────────────────
# Create prices in Stripe Dashboard → Products, then paste the price_xxx IDs here
STRIPE_STARTER_PRICE_ID = "REPLACE_WITH_STRIPE_STARTER_PRICE_ID"
STRIPE_PRO_PRICE_ID     = "REPLACE_WITH_STRIPE_PRO_PRICE_ID"
# ── Optional: OpenAI-compatible AI gateway ────────────────────────────────────
# e.g. https://api.openai.com/v1  or  https://gateway.ai.cloudflare.com/v1/ACCOUNT/GATEWAY/openai
AI_GATEWAY_URL = ""

# ── Secrets (set with `wrangler secret put <NAME>`) ───────────────────────────
#   wrangler secret put API_SECRET          ← operator/admin bearer token
#   wrangler secret put STRIPE_SECRET_KEY   ← sk_live_...
#   wrangler secret put STRIPE_WEBHOOK_SECRET ← whsec_...
#   wrangler secret put AI_GATEWAY_KEY      ← API key for your AI provider
#   wrangler secret put ALERT_WEBHOOK_URL   ← Slack/Discord webhook (optional)

# KV Namespace — workflow config registry + customer/billing data
[[kv_namespaces]]
binding = "CF_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

# Async job queue
[[queues.producers]]
binding = "CF_QUEUE"
queue = "cf-workflow-queue"

[[queues.consumers]]
queue = "cf-workflow-queue"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

# R2 bucket for assets, AI outputs, educational materials
[[r2_buckets]]
binding = "CF_R2"
bucket_name = "cf-assets"

# Durable Objects — stateful workflow runners
[durable_objects]
bindings = [
  { name = "WORKFLOW_DO", class_name = "WorkflowDurableObject" }
]

[[migrations]]
tag = "v1"
new_classes = ["WorkflowDurableObject"]

# Cron triggers — hourly orchestration heartbeat + billing report
[triggers]
crons = ["0 * * * *"]

# Staging environment
[env.staging]
name = "cf-orchestrator-staging"
vars = { ENVIRONMENT = "staging", STRIPE_STARTER_PRICE_ID = "REPLACE_WITH_STRIPE_STARTER_PRICE_ID", STRIPE_PRO_PRICE_ID = "REPLACE_WITH_STRIPE_PRO_PRICE_ID", AI_GATEWAY_URL = "" }

[env.staging.durable_objects]
bindings = [
  { name = "WORKFLOW_DO", class_name = "WorkflowDurableObject" }
]
