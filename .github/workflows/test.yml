name: Validate Hardhat Project

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: hardhat-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Scan tracked files for common secret formats
        run: npm run scan:secrets

      - name: Compile contracts
        run: npm run compile

      - name: Run unit tests
        run: npm test

      - name: Lint Solidity
        run: npm run lint

      - name: Report complete dependency audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=high
